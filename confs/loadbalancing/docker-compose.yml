---
services:
  nginx:
    restart: always
    image: nginx:1-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
      - ./default.conf:/etc/nginx/conf.d/default.conf
    hostname: nginx
  echo-1:
    restart: always
    hostname: echo-1
    image: weshigbee/nginx-echo
    ports:
      - 5000:8080
  echo-2:
    restart: always
    hostname: echo-2
    image: weshigbee/nginx-echo
  echo-3:
    restart: always
    hostname: echo-3
    image: weshigbee/nginx-echo