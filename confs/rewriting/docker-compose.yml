---
services:
  nginx:
    restart: always
    image: nginx:1-alpine
    ports:
      - 8080:8080
      - 8081:8081
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ../../files/test/:/out
    hostname: nginx  
    command: ["nginx-debug", "-g", "daemon off;"]  
  echo:
    restart: always
    image: hashicorp/http-echo
    command: ["-text", "hello"]
    # ports:
    #   - 5678:5678  