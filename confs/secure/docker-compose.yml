---
services:
  nginx:
    restart: always
    image: nginx:1-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/certs
    hostname: nginx
  echo-1:
    restart: always
    hostname: echo-1
    image: weshigbee/nginx-echo
  email:
    restart: always
    image: mailhog/mailhog