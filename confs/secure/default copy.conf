upstream echoz {
    server echo-1:8080;
}

server {
    listen       80;
    listen       443 ssl;
    http2        on;

    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;

    location / {
        proxy_pass http://echoz;
    }  
}

server {
    listen       443 ssl;
    http2        on;
    server_name  example.com;

    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;

    location / {
        proxy_pass http://email:8025;
    }  
}