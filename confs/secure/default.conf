upstream echoz {
    server echo-1:8080;
}

server {
    listen 80 default_server;
    return 301 https:$host$request_uri;
}

ssl_certificate /certs/server.pem;
ssl_certificate_key /certs/server.key;

server {
    listen       443 ssl;
    http2        on;

    location / {
        proxy_pass http://echoz;
    }  
}

server {
    listen       443 ssl;
    http2        on;
    server_name  example.com;

    location / {
        proxy_pass http://email:8025;
    }  
}