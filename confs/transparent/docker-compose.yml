---
services:
  nginx:
    restart: always
    image: nginx:1-alpine
    ports:
      - 8090:8090
      - 8091:8091
      - 2525:2525
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx/ 
      - ./files/test:/usr/share/nginx/test/
  ghost:
    restart: always
    image: ghost
    # ports:
    #   - 2368:2368
    environment:
      - NODE_ENV=development
      - url=http://localhost:8090
  mailhog:
    restart: always
    image: mailhog/mailhog
    # ports:
    #   - 8025:8025
  echo:
    restart: always
    image: hashicorp/http-echo
    command: ["-text", "hello"]
    # ports:
    #   - 5678:5678  